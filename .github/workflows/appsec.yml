name: AppSec
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: qqrm-labs/.github/.github/workflows/security.yml@e92efba3e5c6602e28860d91aa6d77c8f2c73b7c
    with:
      # GitHub Default setup owns CodeQL; AppSec verifies its native analysis.
      language: c-cpp
      codeql-mode: default

  security-gate:
    name: security
    needs: security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all security checks to succeed
        shell: bash
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$SECURITY_RESULT" = success
